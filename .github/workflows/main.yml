name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Raport typów nie blokuje budowy APK; błędy zobaczysz w logu.
      - name: Typecheck (informacyjnie)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build web
        run: npx vite build

      - name: Add Android project
        run: npx cap add android

      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          sed -i 's#android:configChanges="#android:screenOrientation="sensorLandscape" android:configChanges="#' "$M"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fado-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
